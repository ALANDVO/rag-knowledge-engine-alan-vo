version: "3.9"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HOSTNAME=localhost
      - KC_HOSTNAME_PORT=8080
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - REQUIRE_SSO=true
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/rag-engine
      - OIDC_CLIENT_ID=rag-knowledge-engine
      - OIDC_CLIENT_SECRET=your-client-secret-change-in-production
      - OIDC_REDIRECT_URI=http://localhost:8000/api/auth/callback
      - SESSION_SECRET=${SESSION_SECRET}
      - DEMO_MODE=false
    depends_on:
      keycloak:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  keycloak_data:
