[project]
name = "rag-knowledge-engine"
version = "1.0.0"
description = "Enterprise-grade Retrieval-Augmented Generation platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alan Vo", email = "alanvo@gmail.com"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.6.0",
    "structlog>=25.1.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "python-jose[cryptography]>=3.3.0",
    "authlib>=1.3.0",
    "itsdangerous>=2.2.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py312"